knpu_oauth2_client:
    # Use a custom Guzzle client so we can point SSL verification to cacert.pem on Windows.
    http_client: app.oauth_http_client
    clients:
        google:
            type: google
            client_id: '%env(GOOGLE_CLIENT_ID)%'
            client_secret: '%env(GOOGLE_CLIENT_SECRET)%'
            redirect_route: connect_google_check
